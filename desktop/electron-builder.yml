appId: com.iklsi.tily
productName: Tily
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../backend/publish
    to: backend
  - from: renderer/dist
    to: renderer
    filter:
      - "**/*"
      - "!**/*.map"
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
  icon: resources/icon.png
  identity: "-"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: Tily pilote le Finder pour placer les fichiers dans la Corbeille.
dmg:
  artifactName: Tily-${version}-${arch}.dmg
publish:
  provider: github
  owner: IKLSI
  repo: Tily
  releaseType: release
