name: Publication winget

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: MaximeRazafinjato.Tily
          installers-regex: '-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
