name: macOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Renderer
        working-directory: desktop/renderer
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
      - name: Desktop
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Tests
        run: dotnet test backend/Tily.slnx
      - name: Paquet
        run: sh scripts/build-mac.sh
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" desktop/release/*.dmg --generate-notes || gh release upload "$GITHUB_REF_NAME" desktop/release/*.dmg --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Tily-dmg
          path: desktop/release/*.dmg
