name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            desktop/renderer/pnpm-lock.yaml
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Renderer
        working-directory: desktop/renderer
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build
      - name: Desktop
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Configuration de packaging
        working-directory: desktop
        run: pnpm exec electron-builder --mac --dir --publish never -c.mac.identity=null
      - name: Tests
        run: dotnet test backend/Tily.slnx
      - name: Test de bout en bout
        working-directory: desktop
        run: pnpm e2e

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            desktop/renderer/pnpm-lock.yaml
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Paquet
        run: sh scripts/build-mac.sh
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(printf '%s\n' \
            '## Installation' \
            '' \
            'Glisser Tily dans Applications, puis retirer la quarantaine avant le premier lancement (application signée ad hoc, sans notarisation) :' \
            '' \
            '```bash' \
            'xattr -cr /Applications/Tily.app' \
            '```')
          gh release create "$GITHUB_REF_NAME" desktop/release/*.dmg --notes "$NOTES" --generate-notes || gh release upload "$GITHUB_REF_NAME" desktop/release/*.dmg --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: Tily-dmg
          path: desktop/release/*.dmg
