name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            desktop/renderer/pnpm-lock.yaml
      - name: Renderer
        working-directory: desktop/renderer
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
      - name: Desktop
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Tests
        run: dotnet test backend/Tily.slnx

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            desktop/renderer/pnpm-lock.yaml
      - name: Paquet
        run: sh scripts/build-mac.sh
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(printf '%s\n' \
            '## Installation' \
            '' \
            'Glisser Tily dans Applications, puis retirer la quarantaine avant le premier lancement (application signée ad hoc, sans notarisation) :' \
            '' \
            '```bash' \
            'xattr -cr /Applications/Tily.app' \
            '```')
          gh release create "$GITHUB_REF_NAME" desktop/release/*.dmg --notes "$NOTES" --generate-notes || gh release upload "$GITHUB_REF_NAME" desktop/release/*.dmg --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Tily-dmg
          path: desktop/release/*.dmg
